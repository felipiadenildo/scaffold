# Testes, lint e build do app em todo push e pull request que mexa em app/web.
name: CI

on:
  push:
    branches: [main]
    paths:
      - 'app/web/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'app/web/**'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Testes, lint e build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
