# Publica o app no Cloudflare Workers quando a main muda em app/web (ou à mão, pela aba Actions).
# Precisa dos secrets CLOUDFLARE_API_TOKEN (modelo "Edit Cloudflare Workers") e CLOUDFLARE_ACCOUNT_ID.
name: Deploy do app

on:
  push:
    branches: [main]
    paths:
      - 'app/web/**'
      - '.github/workflows/deploy-app.yml'
  workflow_dispatch:

permissions:
  contents: read

# Um deploy por vez, sem cancelar o que já começou.
concurrency:
  group: deploy-app
  cancel-in-progress: false

jobs:
  deploy:
    name: Testar, gerar e publicar
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://app.myscaffold.workers.dev
    defaults:
      run:
        working-directory: app/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - name: Publicar no Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
