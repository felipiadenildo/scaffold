<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scaffold App</title>
    <!--
      Aplica o tema salvo antes do primeiro paint, pra quem usa o escuro não ver a tela clara
      piscar enquanto o React carrega. Mesma chave de useTema.ts (scaffold.local.tema), salva
      como documento { atualizadoEm, dados } pela camada de armazenamento. Claro é o padrão.
    -->
    <script>
      try {
        var tema = JSON.parse(localStorage.getItem('scaffold.local.tema') || 'null')
        document.documentElement.setAttribute('data-theme', tema && tema.dados === 'dark' ? 'dark' : 'light')
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light')
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
